name: Commerce P0 CI

on:
  push:
    branches:
      - develop/commerce-foundation
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build-only
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-build-only
      BETTER_AUTH_SECRET: dummy-build-secret-012345678901234567890123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PUBLIC_INVITATION_BASE_URL: http://localhost:3000
      PUBLIC_INVITATION_MODE: path
      ALLOW_PUBLIC_SIGNUP: "false"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      P0_PREFLIGHT_ALLOW_PLACEHOLDERS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Environment preflight
        run: bun run p0:preflight

      - name: Build
        run: bun run build

  database-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply commerce bootstrap twice
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/run-weddings-migrations.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/run-weddings-migrations.sql

      - name: Verify tenant isolation and integrity
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/p0_core_verify.sql
