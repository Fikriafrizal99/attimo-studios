name: Commerce P0 CI

on:
  push:
    branches:
      - develop/commerce-foundation
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build-only
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-build-only
      BETTER_AUTH_SECRET: dummy-build-secret-012345678901234567890123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PUBLIC_INVITATION_BASE_URL: http://localhost:3000
      PUBLIC_INVITATION_MODE: path
      ALLOW_PUBLIC_SIGNUP: "false"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
