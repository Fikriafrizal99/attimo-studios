name: Commerce Foundation CI

on:
  push:
    branches:
      - develop/commerce-foundation
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: development
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build-only
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-build-only
      BETTER_AUTH_SECRET: dummy-build-secret-012345678901234567890123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PUBLIC_INVITATION_BASE_URL: http://localhost:3000
      PUBLIC_INVITATION_MODE: path
      ALLOW_PUBLIC_SIGNUP: "false"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      P0_PREFLIGHT_ALLOW_PLACEHOLDERS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Environment preflight
        run: bun run p0:preflight

      - name: Build
        run: bun run build

  database-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create Supabase-compatible database roles
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN BYPASSRLS; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          SQL

      - name: Apply canonical migration chain
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Verify tenant isolation and integrity
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/p0_core_verify.sql

      - name: Verify Phase 1.3 database invariants
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/phase1_3_invariants_verify.sql

      - name: Verify Phase 1.4 Better Auth tenant RLS
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/phase1_4_rls_verify.sql

      - name: Verify Phase 1.5 owner collaborator permissions
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/phase1_5_permissions_verify.sql

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build self-host image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-anon-key-for-build-only \
            --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            -t attimo-wedding:ci .

      - name: Start self-host image
        run: |
          docker run -d --name attimo-wedding-ci -p 3100:3000 \
            -e APP_ENV=development \
            -e NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-anon-key-for-runtime-only \
            -e SUPABASE_SERVICE_ROLE_KEY=dummy-service-role-key-for-runtime-only \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres \
            -e BETTER_AUTH_SECRET=dummy-build-secret-012345678901234567890123456789 \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            -e PUBLIC_INVITATION_BASE_URL=http://localhost:3000 \
            -e PUBLIC_INVITATION_MODE=path \
            -e ALLOW_PUBLIC_SIGNUP=false \
            -e P0_PREFLIGHT_ALLOW_PLACEHOLDERS=true \
            attimo-wedding:ci

      - name: Verify container health endpoint
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3100/api/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' attimo-wedding-ci 2>/dev/null | grep -q true; then
              docker logs attimo-wedding-ci || true
              exit 1
            fi
            sleep 3
          done
          docker logs attimo-wedding-ci || true
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs attimo-wedding-ci || true

      - name: Cleanup container
        if: always()
        run: docker rm -f attimo-wedding-ci >/dev/null 2>&1 || true
